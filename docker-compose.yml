version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: noticebridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noticebridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noticebridge_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-noticebridge}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noticebridge -d noticebridge"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5439:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: noticebridge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=NoticeBridge
      - VERSION=1.0.0
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://noticebridge:noticebridge_dev_secret@postgres:5432/noticebridge}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-noticebridge_jwt_dev_secret_key_replace_in_production_2026}
      - FINANCIAL_SIMULATION_MODE=${FINANCIAL_SIMULATION_MODE:-true}
      - SIMULATION_MODE=${SIMULATION_MODE:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - backend-uploads:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: noticebridge-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}

volumes:
  postgres-data:
  backend-uploads:
